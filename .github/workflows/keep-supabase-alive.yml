name: keep-supabase-alive (4x daily)

on:
  schedule:
    - cron: "0 */6 * * *"  # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROJECT_A }}
      SUPABASE_ANON: ${{ secrets.SUPABASE_ANON_PROJECT_A }}
    steps:
      - name: Query products table
        run: |
          set -e
          # Real read on a user table: a constant RPC (select 1) may not count as database activity.
          # --fail-with-body turns any HTTP error into a failed job instead of a silent success.
          curl -sS --fail-with-body \
            -w "\nHTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON" \
            -H "Authorization: Bearer $SUPABASE_ANON"
